version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/node:20.11
    environment:
      NODE_ENV: production
      DOCKER_IMAGE: ghcr.io/example/api
    steps:
      - checkout
      - run:
          name: Build and push image
          command: |
            pnpm install --frozen-lockfile
            pnpm build
            docker login ghcr.io -u deploy-bot -p "$DEPLOY_KEY"
            docker push "$DOCKER_IMAGE:latest"

workflows:
  deploy:
    jobs:
      - deploy
