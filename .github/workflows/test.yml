name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm security:audit
      - run: pnpm package:check
      - name: Secret Coverage broken fixture should fail CI
        run: |
          if node dist/cli.js scan --path examples/fixtures/broken-app --ci; then
            echo "Broken fixture unexpectedly passed"
            exit 1
          fi
      - name: Secret Coverage clean fixture should pass CI
        run: node dist/cli.js scan --path examples/fixtures/clean-app --ci
