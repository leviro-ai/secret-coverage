name: Secret Coverage
description: 'Detect missing environment variables before your deployment fails.'
author: Leviro AI
inputs:
  path:
    description: Repository path to scan
    required: false
    default: .
  strict:
    description: Fail on warnings as well as critical findings
    required: false
    default: 'false'
  format:
    description: 'Output format: markdown or json'
    required: false
    default: markdown
runs:
  using: composite
  steps:
    - name: Run Secret Coverage scan
      shell: bash
      env:
        SECRET_COVERAGE_FORMAT: ${{ inputs.format }}
        SECRET_COVERAGE_PATH: ${{ inputs.path }}
        SECRET_COVERAGE_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail

        args=(scan --path "$SECRET_COVERAGE_PATH" --format "$SECRET_COVERAGE_FORMAT" --ci)
        if [ "$SECRET_COVERAGE_STRICT" = "true" ]; then
          args+=(--strict)
        fi

        set +e
        output="$(npx --yes --package "@leviro-ai/secret-coverage@0.2.0" secret-coverage "${args[@]}" 2>&1)"
        status=$?
        set -e

        printf '%s\n' "$output"

        if [ "$SECRET_COVERAGE_FORMAT" = "markdown" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## Secret Coverage report"
            echo
            printf '%s\n' "$output"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
branding:
  icon: shield
  color: green
