name: EnvGuard
description: Detect missing environment variables before deployment fails.
author: EnvGuard
inputs:
  path:
    description: Repository path to scan
    required: false
    default: .
  strict:
    description: Fail on warnings as well as critical findings
    required: false
    default: 'false'
  format:
    description: 'Output format: markdown or json'
    required: false
    default: markdown
runs:
  using: composite
  steps:
    - name: Run EnvGuard scan
      shell: bash
      env:
        ENVGUARD_FORMAT: ${{ inputs.format }}
        ENVGUARD_PATH: ${{ inputs.path }}
        ENVGUARD_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail

        args=(scan --path "$ENVGUARD_PATH" --format "$ENVGUARD_FORMAT" --ci)
        if [ "$ENVGUARD_STRICT" = "true" ]; then
          args+=(--strict)
        fi

        set +e
        output="$(node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" 2>&1)"
        status=$?
        set -e

        printf '%s\n' "$output"

        if [ "$ENVGUARD_FORMAT" = "markdown" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## EnvGuard report"
            echo
            printf '%s\n' "$output"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
branding:
  icon: shield
  color: green
